<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vietnamese Legal Assistant — Demo</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b90a0;
    --accent: #4f7cff;
    --user-bubble: #4f7cff;
    --bot-bubble: #1f232c;
    --error: #ff5c6c;
    --warn: #d9a441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--text);
  }
  header .sub {
    font-size: 12px;
    color: var(--muted);
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mode-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-toggle button {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .mode-toggle button.active {
    background: var(--accent);
    color: white;
  }
  button.clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button.clear-btn:hover { color: var(--error); border-color: var(--error); }
  button.ingest-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  button.ingest-btn:hover { color: var(--accent); border-color: var(--accent); }
  button.ingest-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #collection-status {
    font-size: 11px;
    color: var(--muted);
  }
  #collection-status.empty { color: var(--warn); }
  #collection-status.ready { color: #4caf6a; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 3px;
  }
  .msg-row.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .msg-row.error .bubble {
    background: rgba(255, 92, 108, 0.12);
    border: 1px solid var(--error);
    color: var(--error);
  }
  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .badge.web { color: var(--warn); border-color: var(--warn); }
  .badge.opt { color: #4caf6a; border-color: #4caf6a; }
  .badge.cache-hit { background: rgba(76, 175, 106, 0.1); color: #4caf6a; border-color: #4caf6a; }
  .badge.cache-miss { background: rgba(217, 164, 65, 0.1); color: var(--warn); border-color: var(--warn); }
  .opt-stats {
    margin-top: 10px;
    padding: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  .opt-stats div { margin: 3px 0; }
  .opt-stats strong { color: var(--accent); }
  details.sources {
    margin-top: 8px;
    font-size: 12px;
  }
  details.sources summary {
    cursor: pointer;
    color: var(--accent);
  }
  .source-item {
    margin-top: 6px;
    padding: 8px;
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .source-item .src-name { color: var(--muted); font-size: 11px; margin-bottom: 4px; }

  #input-bar {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
  }
  #question {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    font-family: inherit;
  }
  #question:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { color: var(--muted); font-style: italic; font-size: 13px; }

  .approval-card {
    margin-top: 8px;
    padding: 10px 12px;
    background: rgba(217, 164, 65, 0.08);
    border: 1px solid var(--warn);
    border-radius: 8px;
    font-size: 13px;
  }
  .approval-card .approval-title {
    color: var(--warn);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .approval-card .tool-call {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: var(--text);
    background: rgba(255,255,255,0.03);
    padding: 6px 8px;
    border-radius: 6px;
    margin-bottom: 8px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .approval-actions { display: flex; gap: 8px; }
  .approval-actions button {
    border-radius: 6px;
    border: 1px solid var(--border);
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    background: transparent;
    color: var(--text);
  }
  .approval-actions .approve-btn { border-color: #4caf6a; color: #4caf6a; }
  .approval-actions .approve-btn:hover { background: rgba(76,175,106,0.1); }
  .approval-actions .reject-btn { border-color: var(--error); color: var(--error); }
  .approval-actions .reject-btn:hover { background: rgba(255,92,108,0.1); }
  .approval-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .approval-card.resolved { opacity: 0.6; }
  .approval-card .resolved-note { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .eval-btn {
    margin-top: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .eval-btn:hover { color: var(--accent); border-color: var(--accent); }
  .eval-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .eval-card {
    margin-top: 8px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
  }
  .eval-card .eval-title {
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }
  .eval-section { margin-bottom: 10px; }
  .eval-section:last-child { margin-bottom: 0; }
  .eval-section .eval-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .eval-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    border: 1px solid var(--border);
  }
  .eval-badge.pass { color: #4caf6a; border-color: #4caf6a; background: rgba(76,175,106,0.08); }
  .eval-badge.fail { color: var(--error); border-color: var(--error); background: rgba(255,92,108,0.08); }
  .eval-reasoning { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .eval-scores {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 6px;
    margin-top: 4px;
  }
  .eval-score-item {
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    padding: 6px 8px;
    text-align: center;
  }
  .eval-score-item .score-value { font-size: 15px; font-weight: 600; color: var(--accent); }
  .eval-score-item .score-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .eval-issues { margin-top: 6px; font-size: 12px; color: var(--warn); }
  .eval-issues li { margin-left: 16px; }
  .eval-steps { margin-top: 8px; }
  .eval-steps summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  .eval-error { color: var(--error); font-size: 12px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Vietnamese Legal Assistant</h1>
    <div class="sub">Module I: RAG + guardrails · Module II: Personal Assistant agent (LangGraph, HITL)</div>
  </div>
  <div class="controls">
    <span id="collection-status">đang kiểm tra dữ liệu...</span>
    <button class="ingest-btn" id="ingest-btn">⟳ Ingest dữ liệu</button>
    <div class="mode-toggle">
      <button id="mode-stream" class="active">Streaming</button>
      <button id="mode-agent">Agent (CRAG)</button>
      <button id="mode-assistant">Assistant (M2)</button>
    </div>
    <button class="clear-btn" id="clear-btn">Xoá lịch sử</button>
  </div>
</header>

<div id="messages"></div>

<div id="input-bar">
  <textarea id="question" rows="1" placeholder="Hỏi về luật doanh nghiệp... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
  <button id="send-btn">Gửi</button>
</div>

<script>
const STORAGE_KEY = "legal_assistant_chat_history_v1";
const messagesEl = document.getElementById("messages");
const questionEl = document.getElementById("question");
const sendBtn = document.getElementById("send-btn");
const clearBtn = document.getElementById("clear-btn");
const modeStreamBtn = document.getElementById("mode-stream");
const modeAgentBtn = document.getElementById("mode-agent");
const modeAssistantBtn = document.getElementById("mode-assistant");
const ingestBtn = document.getElementById("ingest-btn");
const statusEl = document.getElementById("collection-status");

let mode = "stream"; // "stream" | "agent" | "assistant"
let history = loadHistory();
// Module II — mỗi phiên trình duyệt là 1 thread riêng cho checkpointer (MemorySaver).
let assistantThreadId = localStorage.getItem("assistant_thread_id_v1")
  || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
localStorage.setItem("assistant_thread_id_v1", assistantThreadId);
// Buổi 3 — user_id ổn định cho long-term memory (xuyên nhiều thread/session).
// "Xoá lịch sử" đổi thread_id (mất short-term) nhưng GIỮ user_id → long-term vẫn nhớ.
let assistantUserId = localStorage.getItem("assistant_user_id_v1") || "demo-user";
localStorage.setItem("assistant_user_id_v1", assistantUserId);

function loadHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveHistory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function renderAll() {
  messagesEl.innerHTML = "";
  for (const m of history) renderMessage(m, false);
  scrollToBottom();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderMessage(m, animate) {
  const row = document.createElement("div");
  row.className = `msg-row ${m.role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = m.text;
  row.appendChild(bubble);

  if (m.meta) {
    const meta = document.createElement("div");
    meta.className = "meta";
    if (m.meta.model) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = m.meta.model;
      meta.appendChild(b);
    }
    if (m.meta.web_search_used) {
      const b = document.createElement("span");
      b.className = "badge web";
      b.textContent = "web search fallback";
      meta.appendChild(b);
    }
    bubble.appendChild(meta);
  }

  if (m.meta && m.meta.sub_questions && m.meta.sub_questions.length > 1) {
    const details = document.createElement("details");
    details.className = "sources";
    const summary = document.createElement("summary");
    summary.textContent = `${m.meta.sub_questions.length} sub-questions (query decomposition)`;
    details.appendChild(summary);
    m.meta.sub_questions.forEach((sq, i) => {
      const item = document.createElement("div");
      item.className = "source-item";
      const name = document.createElement("div");
      name.className = "src-name";
      name.textContent = `${i + 1}`;
      const text = document.createElement("div");
      text.textContent = sq;
      item.appendChild(name);
      item.appendChild(text);
      details.appendChild(item);
    });
    bubble.appendChild(details);
  }

  if (m.meta && m.meta.sources && m.meta.sources.length) {
    const details = document.createElement("details");
    details.className = "sources";
    const summary = document.createElement("summary");
    summary.textContent = `${m.meta.sources.length} nguồn tham khảo`;
    details.appendChild(summary);
    for (const s of m.meta.sources) {
      const item = document.createElement("div");
      item.className = "source-item";
      const name = document.createElement("div");
      name.className = "src-name";
      name.textContent = `${s.source || "?"} (score=${s.score?.toFixed?.(3) ?? s.score})`;
      const text = document.createElement("div");
      text.textContent = s.text;
      item.appendChild(name);
      item.appendChild(text);
      details.appendChild(item);
    }
    bubble.appendChild(details);
  }

  if (m.meta && m.meta.optimization && Object.keys(m.meta.optimization).some(k => m.meta.optimization[k])) {
    const optDiv = document.createElement("div");
    optDiv.className = "opt-stats";
    const opt = m.meta.optimization;

    if (opt.cache_hit !== undefined) {
      const cacheDiv = document.createElement("div");
      const cacheBadge = document.createElement("span");
      cacheBadge.className = `badge ${opt.cache_hit ? "cache-hit" : "cache-miss"}`;
      cacheBadge.textContent = opt.cache_hit ? "✓ Cache HIT" : "Cache MISS";
      cacheDiv.appendChild(cacheBadge);
      optDiv.appendChild(cacheDiv);
    }

    if (opt.prompt_cache_read_tokens > 0 || opt.prompt_cache_created_tokens > 0) {
      const pcDiv = document.createElement("div");
      pcDiv.innerHTML = `<strong>Prompt Cache:</strong> created=${opt.prompt_cache_created_tokens} read=${opt.prompt_cache_read_tokens} (hit ratio=${(opt.prompt_cache_hit_ratio * 100).toFixed(0)}%)`;
      optDiv.appendChild(pcDiv);
    }

    if (opt.routing_model) {
      const routeDiv = document.createElement("div");
      routeDiv.innerHTML = `<strong>Routing:</strong> ${opt.routing_model} via ${opt.routing_method}`;
      optDiv.appendChild(routeDiv);
    }

    bubble.appendChild(optDiv);
  }

  if (m.pendingApproval) {
    bubble.appendChild(renderApprovalCard(m.pendingApproval));
  }

  // Bài 5 (Agent Evaluation): mỗi câu trả lời "done" của Assistant có nút
  // "Đánh giá" — bấm mới gọi /assistant/evaluate (on-demand, không tự động
  // mỗi lượt như tracing). m.evalResult lưu lại để không re-fetch khi renderAll().
  if (m.canEvaluate) {
    if (m.evalResult) {
      bubble.appendChild(renderEvalCard(m.evalResult));
    } else if (m.evalError) {
      const err = document.createElement("div");
      err.className = "eval-error";
      err.textContent = `Lỗi đánh giá: ${m.evalError}`;
      bubble.appendChild(err);
    } else {
      const evalBtn = document.createElement("button");
      evalBtn.className = "eval-btn";
      evalBtn.textContent = "📊 Đánh giá";
      evalBtn.addEventListener("click", () => runEvaluation(m, evalBtn));
      bubble.appendChild(evalBtn);
    }
  }

  messagesEl.appendChild(row);
  return { row, bubble };
}

function renderApprovalCard(pending) {
  const card = document.createElement("div");
  card.className = "approval-card" + (pending.resolved ? " resolved" : "");

  const title = document.createElement("div");
  title.className = "approval-title";
  title.textContent = "⚠ Agent muốn gọi tool — cần bạn duyệt (HITL)";
  card.appendChild(title);

  const call = document.createElement("div");
  call.className = "tool-call";
  call.textContent = `${pending.tool_call.name}(${JSON.stringify(pending.tool_call.args)})`;
  card.appendChild(call);

  if (pending.resolved) {
    const note = document.createElement("div");
    note.className = "resolved-note";
    note.textContent = pending.resolved === "approved" ? "✓ Đã duyệt" : "✗ Đã từ chối";
    card.appendChild(note);
    return card;
  }

  const actions = document.createElement("div");
  actions.className = "approval-actions";
  const approveBtn = document.createElement("button");
  approveBtn.className = "approve-btn";
  approveBtn.textContent = "Duyệt ✓";
  const rejectBtn = document.createElement("button");
  rejectBtn.className = "reject-btn";
  rejectBtn.textContent = "Từ chối ✗";

  approveBtn.addEventListener("click", () => resolveApproval(true, approveBtn, rejectBtn));
  rejectBtn.addEventListener("click", () => resolveApproval(false, approveBtn, rejectBtn));

  actions.appendChild(approveBtn);
  actions.appendChild(rejectBtn);
  card.appendChild(actions);
  return card;
}

async function resolveApproval(approve, approveBtn, rejectBtn) {
  approveBtn.disabled = true;
  rejectBtn.disabled = true;

  const lastMsg = history[history.length - 1];
  if (lastMsg && lastMsg.pendingApproval) lastMsg.pendingApproval.resolved = approve ? "approved" : "rejected";
  saveHistory();

  try {
    const res = await fetch("/assistant/approve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        thread_id: assistantThreadId,
        approve,
        rejection_note: approve ? "" : "Người dùng từ chối qua UI",
      }),
    });
    const body = await res.json();
    if (!res.ok) throw new GuardrailError(res.status, body);

    renderAssistantResult(body);
  } catch (err) {
    showError(err);
  } finally {
    renderAll();
  }
}

// ── Bài 5: Agent Evaluation & Observability ──────────────────────────────────
// Nút "Đánh giá" gọi /assistant/evaluate — server đọc LẠI checkpointer theo
// thread_id (không cần frontend gửi kèm lịch sử/trajectory), chấm task success
// + trajectory qua LLM-as-judge (eval.py), trả về ngay trong response.

async function runEvaluation(msg, btn) {
  btn.disabled = true;
  btn.textContent = "⏳ Đang đánh giá...";

  try {
    const res = await fetch("/assistant/evaluate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ thread_id: assistantThreadId }),
    });
    const body = await res.json();
    if (!res.ok) throw new GuardrailError(res.status, body);

    if (body.error) {
      msg.evalError = body.error;
    } else {
      msg.evalResult = body;
    }
  } catch (err) {
    msg.evalError = err.message;
  } finally {
    saveHistory();
    renderAll();
  }
}

function renderEvalCard(body) {
  const card = document.createElement("div");
  card.className = "eval-card";

  const title = document.createElement("div");
  title.className = "eval-title";
  title.textContent = "📊 Kết quả đánh giá";
  card.appendChild(title);

  // Task Success (Section 1-2: End-to-end Evaluation)
  const successSection = document.createElement("div");
  successSection.className = "eval-section";
  const successLabel = document.createElement("div");
  successLabel.className = "eval-label";
  successLabel.textContent = "Task Success";
  successSection.appendChild(successLabel);

  const ts = body.task_success;
  const badge = document.createElement("span");
  badge.className = `eval-badge ${ts.success ? "pass" : "fail"}`;
  badge.textContent = `${ts.success ? "✓ Đạt" : "✗ Chưa đạt"} — điểm ${(ts.score * 100).toFixed(0)}%`;
  successSection.appendChild(badge);

  const reasoning = document.createElement("div");
  reasoning.className = "eval-reasoning";
  reasoning.textContent = ts.reasoning;
  successSection.appendChild(reasoning);
  card.appendChild(successSection);

  // Trajectory Quality (Section 1-2: Trajectory Evaluation)
  const trajSection = document.createElement("div");
  trajSection.className = "eval-section";
  const trajLabel = document.createElement("div");
  trajLabel.className = "eval-label";
  trajLabel.textContent = `Trajectory Quality (${body.trajectory_steps.length} bước, điểm TB ${body.trajectory.overall.toFixed(1)}/5)`;
  trajSection.appendChild(trajLabel);

  const scores = document.createElement("div");
  scores.className = "eval-scores";
  const scoreDefs = [
    ["efficiency", "Hiệu quả"],
    ["logical_order", "Thứ tự logic"],
    ["tool_correctness", "Đúng tool"],
    ["recovery", "Xử lý lỗi"],
  ];
  for (const [key, label] of scoreDefs) {
    const item = document.createElement("div");
    item.className = "eval-score-item";
    const value = document.createElement("div");
    value.className = "score-value";
    value.textContent = `${body.trajectory[key]}/5`;
    const lbl = document.createElement("div");
    lbl.className = "score-label";
    lbl.textContent = label;
    item.appendChild(value);
    item.appendChild(lbl);
    scores.appendChild(item);
  }
  trajSection.appendChild(scores);

  if (body.trajectory.issues && body.trajectory.issues.length) {
    const issuesList = document.createElement("ul");
    issuesList.className = "eval-issues";
    for (const issue of body.trajectory.issues) {
      const li = document.createElement("li");
      li.textContent = issue;
      issuesList.appendChild(li);
    }
    trajSection.appendChild(issuesList);
  }

  if (body.trajectory_steps.length) {
    const details = document.createElement("details");
    details.className = "eval-steps";
    const summary = document.createElement("summary");
    summary.textContent = "Xem chi tiết từng bước";
    details.appendChild(summary);
    body.trajectory_steps.forEach((step, i) => {
      const item = document.createElement("div");
      item.className = "source-item";
      const name = document.createElement("div");
      name.className = "src-name";
      name.textContent = `${i + 1}. ${step.tool}(${JSON.stringify(step.args)})`;
      const text = document.createElement("div");
      text.textContent = step.observation;
      item.appendChild(name);
      item.appendChild(text);
      details.appendChild(item);
    });
    trajSection.appendChild(details);
  }

  card.appendChild(trajSection);
  return card;
}

function setMode(newMode) {
  mode = newMode;
  modeStreamBtn.classList.toggle("active", mode === "stream");
  modeAgentBtn.classList.toggle("active", mode === "agent");
  modeAssistantBtn.classList.toggle("active", mode === "assistant");
}
modeStreamBtn.addEventListener("click", () => setMode("stream"));
modeAgentBtn.addEventListener("click", () => setMode("agent"));
modeAssistantBtn.addEventListener("click", () => setMode("assistant"));

clearBtn.addEventListener("click", () => {
  history = [];
  saveHistory();
  // Buổi 3 demo: đổi thread_id (session mới → short-term mất) nhưng GIỮ user_id.
  // Sau khi xoá, hỏi lại điều đã khai trước đó → agent vẫn nhớ nhờ long-term memory.
  assistantThreadId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
  localStorage.setItem("assistant_thread_id_v1", assistantThreadId);
  renderAll();
});

async function sendMessage() {
  const question = questionEl.value.trim();
  if (!question) return;

  questionEl.value = "";
  questionEl.style.height = "auto";
  sendBtn.disabled = true;

  history.push({ role: "user", text: question });
  saveHistory();
  renderMessage({ role: "user", text: question });
  scrollToBottom();

  if (mode === "stream") {
    await sendStreaming(question);
  } else if (mode === "agent") {
    await sendAgent(question);
  } else {
    await sendAssistant(question);
  }

  sendBtn.disabled = false;
  questionEl.focus();
}

async function sendStreaming(question) {
  const { bubble } = renderMessage({ role: "bot", text: "" });
  const typing = document.createElement("span");
  typing.className = "typing";
  typing.textContent = "đang trả lời...";
  bubble.appendChild(typing);
  scrollToBottom();

  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new GuardrailError(res.status, body);
    }

    typing.remove();
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      full += decoder.decode(value, { stream: true });
      bubble.textContent = full;
      scrollToBottom();
    }

    history.push({ role: "bot", text: full });
    saveHistory();
  } catch (err) {
    bubble.parentElement.remove();
    showError(err);
  }
}

async function sendAgent(question) {
  const { bubble } = renderMessage({ role: "bot", text: "" });
  const typing = document.createElement("span");
  typing.className = "typing";
  typing.textContent = "đang retrieve + grade + generate (CRAG)...";
  bubble.appendChild(typing);
  scrollToBottom();

  try {
    const res = await fetch("/chat/agent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });

    const body = await res.json();
    if (!res.ok) throw new GuardrailError(res.status, body);

    typing.remove();
    bubble.textContent = body.answer;

    const meta = {
      sources: body.sources,
      web_search_used: body.web_search_used,
      sub_questions: body.sub_questions,
      optimization: body.optimization,
    };
    const msg = { role: "bot", text: body.answer, meta };
    history.push(msg);
    saveHistory();
    // Re-render this bubble with meta (sources/badges) attached.
    bubble.parentElement.remove();
    renderMessage(msg);
    scrollToBottom();
  } catch (err) {
    bubble.parentElement.remove();
    showError(err);
  }
}

async function sendAssistant(question) {
  const { bubble } = renderMessage({ role: "bot", text: "" });
  const typing = document.createElement("span");
  typing.className = "typing";
  typing.textContent = "agent đang xử lý (ReAct loop, LangGraph)...";
  bubble.appendChild(typing);
  scrollToBottom();

  try {
    const res = await fetch("/assistant/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ thread_id: assistantThreadId, message: question, user_id: assistantUserId }),
    });
    const body = await res.json();
    if (!res.ok) throw new GuardrailError(res.status, body);

    bubble.parentElement.remove();
    renderAssistantResult(body);
  } catch (err) {
    bubble.parentElement.remove();
    showError(err);
  }
}

function renderAssistantResult(body) {
  if (body.status === "pending_approval") {
    const msg = { role: "bot", text: "(chờ bạn duyệt hành động bên dưới)", pendingApproval: { tool_call: body.tool_call } };
    history.push(msg);
    saveHistory();
    renderMessage(msg);
  } else {
    // status "done" — agent trả lời xong, không cần duyệt gì thêm → cho phép
    // đánh giá lượt này (Bài 5). canEvaluate=false khi status vẫn đang chờ
    // duyệt (nhánh trên) vì evaluate_thread sẽ trả lỗi lúc đó (chưa có final answer).
    const msg = { role: "bot", text: body.answer || "", canEvaluate: true };
    history.push(msg);
    saveHistory();
    renderMessage(msg);
  }
  scrollToBottom();
}

class GuardrailError extends Error {
  constructor(status, body) {
    super(body?.reason || body?.detail || `HTTP ${status}`);
    this.status = status;
    this.body = body;
  }
}

function showError(err) {
  let text;
  if (err instanceof GuardrailError && err.status === 400) {
    text = `Bị chặn bởi guardrails: ${err.body.reason || "unknown"}`;
    if (err.body.details) text += `\n${JSON.stringify(err.body.details)}`;
  } else {
    text = `Lỗi: ${err.message}`;
  }
  const msg = { role: "error", text };
  history.push(msg);
  saveHistory();
  renderMessage(msg);
  scrollToBottom();
}

async function refreshCollectionStatus() {
  try {
    const res = await fetch("/admin/collection-status");
    const body = await res.json();
    if (body.count > 0) {
      statusEl.textContent = `${body.count} chunks trong "${body.collection}"`;
      statusEl.className = "ready";
    } else {
      statusEl.textContent = `"${body.collection}" rỗng — bấm Ingest dữ liệu trước khi hỏi`;
      statusEl.className = "empty";
    }
  } catch {
    statusEl.textContent = "không kết nối được server";
    statusEl.className = "empty";
  }
}

ingestBtn.addEventListener("click", async () => {
  ingestBtn.disabled = true;
  const original = ingestBtn.textContent;
  ingestBtn.textContent = "⟳ đang ingest...";
  try {
    const res = await fetch("/admin/ingest", { method: "POST" });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || "ingest thất bại");
    await refreshCollectionStatus();
  } catch (err) {
    statusEl.textContent = `Lỗi ingest: ${err.message}`;
    statusEl.className = "empty";
  } finally {
    ingestBtn.disabled = false;
    ingestBtn.textContent = original;
  }
});

refreshCollectionStatus();

questionEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
questionEl.addEventListener("input", () => {
  questionEl.style.height = "auto";
  questionEl.style.height = questionEl.scrollHeight + "px";
});
sendBtn.addEventListener("click", sendMessage);

renderAll();
</script>
